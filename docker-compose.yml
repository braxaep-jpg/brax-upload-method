version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - ACCESS_SECRET=${ACCESS_SECRET:?Set ACCESS_SECRET in .env}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:4000}
    volumes:
      - ./tmp:/app/tmp
    restart: unless-stopped
